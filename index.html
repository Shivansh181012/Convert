<!DOCTYPE html>
<html>
<body>
<h2>The JavaScript String() Methods</h2>
<p>The String() method converts a number to a string.</p>
<p id="number_results"></p>
<p id="string_results"></p>
<script>
var x = 70;
var y = 90;
document.getElementById("number_results").innerHTML = x+y;
document.getElementById("string_results").innerHTML = String(x) + String(y);
// Does not add because it is a string it concatenates
</script>
</body>
</html>
